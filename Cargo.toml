[workspace]
members = ["linguist-types"]

[package]
name = "linguist"
version = "0.1.11"
edition = "2024"
rust-version = "1.88"

description = "Programming language detection library based on Github Linguist."
license = "MIT"
repository = "https://github.com/drshade/linguist"

keywords = ["language", "detection", "linguist", "github", "syntax"]
categories = ["development-tools", "parsing", "text-processing"]

[[bin]]
name = "linguist"
required-features = ["cli"]

[dependencies]
linguist-types = { path = "linguist-types", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
fancy-regex = "0.19"
clap = { version = "4", features = ["derive"], optional = true }

[features]
cli = ["dep:clap"]

[build-dependencies]
linguist-types = { path = "linguist-types", version = "0.1" }
serde_yaml_ng = "0.10"
serde_json = "1"

name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched on a tag ref by auto-release.yml (tags it pushes don't fire `push` here).
  # Also lets a release be re-run by hand from the Actions tab: pick the tag as the ref.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: the key includes the Cargo.lock hash, which changes on every
      # version bump, so a release never hits the previous release's cache. Its post-run
      # cleanup also trips over the target/package/ dir that `cargo publish` leaves behind.
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "linguist") | .version')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
      - name: Fetch test samples
        run: bash tests/pull-samples.sh
      - name: Test
        run: cargo test --features cli
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

name: Sync upstream definitions

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch ci.yml on the PR branch

env:
  CARGO_TERM_COLOR: always

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull upstream definitions
        run: bash definitions/pull-new.sh
      - name: Check for definition changes
        id: diff
        run: echo "changed=$(git status --porcelain definitions/ | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Fetch matching test samples
        if: steps.diff.outputs.changed != '0'
        run: bash tests/pull-samples.sh
      - name: Test against new definitions
        if: steps.diff.outputs.changed != '0'
        run: cargo test
      - name: Bump patch version
        id: bump
        if: steps.diff.outputs.changed != '0'
        run: |
          CURRENT=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "linguist") | .version')
          NEW=$(echo "$CURRENT" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          sed -i "0,/^version = \"$CURRENT\"/s//version = \"$NEW\"/" Cargo.toml
          cargo update --workspace
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        id: pr
        if: steps.diff.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/sync-upstream-definitions
          commit-message: "sync: upstream github-linguist definitions (v${{ steps.bump.outputs.version }})"
          title: "sync: upstream github-linguist definitions (v${{ steps.bump.outputs.version }})"
          body: |
            Automated weekly sync of `definitions/*.yml` (and the pinned
            `definitions/UPSTREAM_COMMIT`) from github-linguist/linguist,
            with the patch version bumped to ${{ steps.bump.outputs.version }}.

            Tests passed against the new definitions with the matching samples
            snapshot in this workflow run (the bump only happens after a green
            test run).

            After merging, release with:

                git pull && git tag v${{ steps.bump.outputs.version }} && git push origin --tags
      - name: Trigger CI on the PR branch
        # Events caused by GITHUB_TOKEN don't trigger other workflows, so the PR above gets
        # no `pull_request` CI run. workflow_dispatch is exempt from that rule, and its
        # check runs attach to the branch head, so the PR shows them like any other.
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref auto/sync-upstream-definitions
        env:
          GH_TOKEN: ${{ github.token }}
